<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" style="background-color: #0d1117; border-radius: 24px;">
  <defs>
    <!-- Outer Cyber Guardrail Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Frame -->
  <path d="M 256 48 L 416 112 V 240 C 416 340 348 424 256 464 C 164 424 96 340 96 240 V 112 Z" 
        fill="url(#coreGlow)" 
        stroke="url(#shieldBorder)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Security Line -->
  <path d="M 256 80 L 384 132 V 236 C 384 316 328 384 256 418 C 184 384 128 316 128 236 V 132 Z" 
        fill="none" 
        stroke="#334155" 
        stroke-width="4" 
        stroke-dasharray="8 8"/>

  <!-- Dual LLM Neural Network Graphic (Untrusted -> Trusted -> Guardrail) -->
  <g transform="translate(0, -10)">
    <!-- Connection Cables / Neural Synapses -->
    <path d="M 196 210 L 256 290 L 316 210" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 196 210 L 316 210" fill="none" stroke="#818cf8" stroke-width="4" stroke-dasharray="6 6"/>

    <!-- Untrusted Input Node (Left) -->
    <circle cx="196" cy="210" r="24" fill="url(#coreGlow)" stroke="#f43f5e" stroke-width="6"/>
    <circle cx="196" cy="210" r="8" fill="#f43f5e"/>

    <!-- Trusted Processing Node (Right) -->
    <circle cx="316" cy="210" r="24" fill="url(#coreGlow)" stroke="#10b981" stroke-width="6"/>
    <circle cx="316" cy="210" r="8" fill="#10b981"/>

    <!-- Dual Guardrail Core Node (Bottom Center) -->
    <circle cx="256" cy="290" r="32" fill="url(#coreGlow)" stroke="url(#nodeGrad)" stroke-width="8" filter="url(#glow)"/>
    
    <!-- Lock / Verification Symbol inside Core -->
    <path d="M 248 282 V 276 C 248 271.58 251.58 268 256 268 C 260.42 268 264 271.58 264 276 V 282 M 244 282 H 268 V 302 H 244 Z" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Secure Checkmark Badge at Bottom -->
  <circle cx="256" cy="400" r="20" fill="#10b981" />
  <path d="M 248 400 L 254 406 L 266 394" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
